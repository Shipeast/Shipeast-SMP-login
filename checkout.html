<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no">
<title>Shipeast SMP – Checkout</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{min-height:100vh;background:#1c1c1c;overflow:auto;color:#fff}

/* ===== BACKGROUND ===== */
.bg{
  position:fixed;inset:0;
  background:
    linear-gradient(90deg,rgba(255,255,0,.35) 1px,transparent 1px),
    linear-gradient(180deg,rgba(255,255,0,.35) 1px,transparent 1px),
    radial-gradient(circle at 30% 30%,#333,#1c1c1c);
  background-size:80px 80px,80px 80px,cover;
  animation:gridMove 25s linear infinite;
}
.bg::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 70% 60%,rgba(255,215,0,.2),transparent 60%);
  animation:pulse 6s ease-in-out infinite alternate;
}
@keyframes gridMove{0%{background-position:0 0,0 0,center}100%{background-position:400px 240px,240px 400px,center}}
@keyframes pulse{from{opacity:.2}to{opacity:.5}}

/* ===== HOME BUTTON ===== */
.home{
  position:fixed;top:24px;left:24px;z-index:3;
  width:56px;height:56px;border-radius:18px;
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.home svg{width:26px;height:26px;stroke:#ffd400;stroke-width:2;fill:none}

/* ===== WRAPPER ===== */
.wrapper{
  position:relative;z-index:2;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;
  padding-top:120px;
}

/* ===== CARD ===== */
.card{
  width:100%;max-width:400px;
  padding:40px;
  border-radius:28px;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  backdrop-filter:blur(20px);
  box-shadow:0 30px 80px rgba(0,0,0,.35);
}

.card h1{
  text-align:center;
  color:#ffd400;
  margin-bottom:24px;
}

.price-box{
  text-align:center;
  margin-bottom:20px;
  font-weight:800;
  font-size:16px;
  color:#ffd400;
  line-height:1.6;
}

/* ===== INPUTS ===== */
.field{margin-bottom:16px}
.field input{
  width:100%;
  padding:14px 16px;
  border-radius:12px;
  border:none;
  background:rgba(255,255,255,.1);
  color:#fff;
  font-size:14px;
}

/* ===== ACCOUNT BOX ===== */
.account-box{
  margin-top:14px;
  padding:16px;
  border-radius:14px;
  text-align:center;
  font-weight:800;
  letter-spacing:1px;
  font-size:18px;
  background:rgba(255,255,0,.2);
  cursor:pointer;
}

/* ===== IMPORTANT NOTE ===== */
.important-note{
  margin-top:18px;
  padding:16px;
  border-radius:14px;
  background:rgba(255,0,0,.15);
  border:1px solid rgba(255,0,0,.5);
  text-align:center;
  font-weight:700;
  color:#ff4d4d;
}
.important-note span{
  display:block;
  margin-top:6px;
  font-size:16px;
  color:#fff;
}

@media(max-width:600px){
  .card{padding:28px}
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="home" onclick="location.href='index.html'">
  <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
</div>

<div class="wrapper">
  <div class="card">
    <h1>Platba VIP</h1>

    <div class="price-box">
      50 Kč / měsíc<br>
      150 Kč / rok
    </div>

    <div class="field">
      <input type="email" placeholder="Tvůj email">
    </div>

    <div class="field">
      <input type="text" placeholder="Herní jméno">
    </div>

    <div class="account-box" onclick="copyAccount()">
      103724597/0100
    </div>

    <div class="important-note">
      ⚠️ POVINNÉ DO ZPRÁVY PRO PŘÍJEMCE:
      <span>Email, Herní jméno</span>
    </div>

  </div>
</div>

<script>
function copyAccount(){
  navigator.clipboard.writeText("103724597/0100");
  alert("Číslo účtu zkopírováno");
}
</script>

</body>
</html>
