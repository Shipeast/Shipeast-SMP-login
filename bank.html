<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipeast SMP – Bankovní převod</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{min-height:100vh;background:#1c1c1c;overflow:auto;color:#fff}

/* ===== BACKGROUND ===== */
.bg{
  position:fixed;inset:0;
  background:
    linear-gradient(90deg,rgba(255,255,0,.35) 1px,transparent 1px),
    linear-gradient(180deg,rgba(255,255,0,.35) 1px,transparent 1px),
    radial-gradient(circle at 30% 30%,#333,#1c1c1c);
  background-size:80px 80px,80px 80px,cover;
  animation:gridMove 25s linear infinite;
}
.bg::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 70% 60%,rgba(255,215,0,.2),transparent 60%);
  animation:pulse 6s ease-in-out infinite alternate;
}
@keyframes gridMove{0%{background-position:0 0,0 0,center}100%{background-position:400px 240px,240px 400px,center}}
@keyframes pulse{from{opacity:.2}to{opacity:.5}}

/* ===== HOME BUTTON ===== */
.home{
  position:fixed;top:24px;left:24px;z-index:3;
  width:56px;height:56px;border-radius:18px;
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.3);
  transition:.3s ease;
}
.home:hover{transform:translateY(-4px)}
.home svg{width:26px;height:26px;stroke:#ffd400;stroke-width:2;fill:none}

/* ===== WRAPPER ===== */
.wrapper{
  position:relative;z-index:2;
  min-height:100%;
  display:flex;flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:60px;
  gap:28px;
}

/* ===== CARD (STEJNÁ JAKO PAYPAL) ===== */
.card{
  width:100%;max-width:400px;
  padding:42px;
  border-radius:28px;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  backdrop-filter:blur(20px);
  box-shadow:0 30px 80px rgba(0,0,0,.35);
  text-align:center;
}

.card h1{
  font-size:26px;
  margin-bottom:18px;
  color:#ffd400;
}

.price-box{
  display:flex;
  gap:14px;
  justify-content:center;
  margin-bottom:22px;
}
.price{
  padding:10px 16px;
  border-radius:14px;
  background:rgba(255,215,0,.15);
  font-weight:800;
  color:#ffd400;
}

/* ČERVENÉ UPOZORNĚNÍ */
.note{
  background:rgba(255,0,0,.15);
  border:1px solid rgba(255,0,0,.4);
  padding:14px;
  border-radius:14px;
  font-weight:700;
  margin-bottom:18px;
  color:#ff4d4d;
}

/* ÚČET */
.account{
  background:rgba(255,255,255,.12);
  padding:16px;
  border-radius:16px;
  font-weight:800;
  font-size:18px;
  cursor:pointer;
  color:#fff;
  margin-bottom:10px;
}

.copy-info{
  font-size:13px;
  opacity:.7;
  margin-bottom:22px;
}

/* BUTTON */
.pay-btn{
  display:block;
  width:100%;
  padding:16px;
  border:none;border-radius:50px;
  background:linear-gradient(135deg,#ffd400,#ffb300);
  font-weight:800;font-size:16px;
  cursor:pointer;
  box-shadow:0 12px 40px rgba(0,0,0,.4);
  color:#1c1c1c;
}
.pay-btn:active{transform:scale(.97)}

@media(max-width:600px){
  .card{padding:32px}
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="home" onclick="location.href='index.html'">
  <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
</div>

<div class="wrapper">
  <div class="card">
    <h1>Bankovní převod</h1>

    <div class="price-box">
      <div class="price">50 Kč / měsíc</div>
      <div class="price">150 Kč / rok</div>
    </div>

    <div class="note">
      DO ZPRÁVY PRO PŘÍJEMCE NAPIŠ:<br>
      <strong>Email + Herní jméno</strong>
    </div>

    <div class="account" onclick="copyAccount()">
      103724597/0100
    </div>
    <div class="copy-info">Klikni na číslo účtu pro kopírování</div>

    <button class="pay-btn" onclick="alert('Otevři své bankovnictví a vlož číslo účtu')">
      Pokračovat k platbě
    </button>
  </div>
</div>

<script>
function copyAccount(){
  const el=document.createElement('input');
  el.value='103724597/0100';
  document.body.appendChild(el);
  el.select();
  document.execCommand('copy');
  document.body.removeChild(el);
  alert('Číslo účtu zkopírováno');
}
</script>

</body>
</html>
