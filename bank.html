<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipeast SMP – Bankovní převod</title>

<style>
* { box-sizing: border-box; font-family: Inter, system-ui, sans-serif; margin: 0; padding: 0; }
body { min-height: 100vh; background: #1c1c1c; color: #fff; display: flex; flex-direction: column; align-items: center; overflow: auto; }

/* BACKGROUND */
.bg{
  position: fixed; inset: 0;
  background:
    linear-gradient(90deg, rgba(255,255,0,.25) 1px, transparent 1px),
    linear-gradient(180deg, rgba(255,255,0,.25) 1px, transparent 1px),
    radial-gradient(circle at 30% 30%, #222, #1c1c1c);
  background-size: 80px 80px, 80px 80px, cover;
  animation: gridMove 25s linear infinite;
}
.bg::after{
  content:""; position:absolute; inset:0;
  background: radial-gradient(circle at 70% 60%, rgba(255,215,0,.15), transparent 60%);
  animation: pulse 6s ease-in-out infinite alternate;
}
@keyframes gridMove {0%{background-position:0 0,0 0,center} 100%{background-position:400px 240px,240px 400px,center}}
@keyframes pulse {from{opacity:.15} to{opacity:.35}}

/* HOME BUTTON */
.home-btn{
  position: fixed; top:28px; left:28px; width:52px; height:52px;
  border-radius:16px; background: linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  backdrop-filter: blur(14px); display:flex; justify-content:center; align-items:center;
  box-shadow:0 15px 35px rgba(0,0,0,.3); cursor:pointer; transition:.3s;
  z-index:50;
}
.home-btn svg { width:22px; height:22px; fill:none; stroke:#ffd400; stroke-width:2; }
.home-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow:0 25px 50px rgba(0,0,0,.35); }

/* WRAPPER */
.wrapper{
  display: flex; flex-direction: column; align-items: center; z-index:2; padding: 60px 20px 60px 20px;
  width: 100%; max-width: 480px;
}
.wrapper h1 { color:#ffd400; text-align:center; margin-bottom:24px; font-size:28px; }

/* BANK TRANSFER CARD */
.transfer-card{
  width:100%; padding:36px 28px; border-radius:28px;
  background: rgba(255,255,255,0.05); 
  backdrop-filter: blur(24px); box-shadow:0 25px 70px rgba(0,0,0,.4);
  display:flex; flex-direction: column; gap:18px;
}
.transfer-card .label { font-weight:600; opacity:0.8; color:#fff; }
.transfer-card .account {
  background: rgba(255,255,255,.15); padding:14px 18px; border-radius:16px; font-weight:700; color:#fff; cursor:pointer;
  text-align:center; transition:.2s;
}
.transfer-card .account:hover { background: rgba(255,255,255,.25); }

/* INSTRUCTION */
.transfer-card .instruction {
  margin-top:10px; font-weight:700; color:#ff4c4c; text-align:center; font-size:15px;
  background: rgba(0,0,0,.2); padding:10px 12px; border-radius:12px;
}

/* PRICES */
.prices { margin-top:20px; display:flex; justify-content: center; gap:16px; flex-wrap: wrap; }
.price-box {
  background: linear-gradient(135deg, #ffd400, #ffb300);
  color:#1c1c1c; font-weight:700; font-size:16px;
  padding:12px 18px; border-radius:16px; display:flex; align-items:center; gap:6px;
  box-shadow:0 8px 20px rgba(0,0,0,.35); cursor:default;
}
.price-box span { font-size:14px; opacity:.8; }

/* CONFIRM BUTTON */
.buy-btn{
  margin-top:28px; padding:16px; border:none; border-radius:50px;
  background: linear-gradient(135deg,#ffd400,#ffb300); color:#1c1c1c;
  font-weight:800; font-size:16px; cursor:pointer; box-shadow:0 12px 40px rgba(0,0,0,.4);
  width:100%;
  text-align:center;
  transition:.2s;
}
.buy-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow:0 18px 50px rgba(0,0,0,.45); }
.buy-btn:active { transform: scale(.97); }

</style>
</head>
<body>

<div class="bg"></div>

<!-- HOME BUTTON -->
<div class="home-btn" onclick="location.href='index.html'" aria-label="Home">
  <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
</div>

<div class="wrapper">
  <h1>Bankovní převod VIP</h1>

  <div class="transfer-card">
    <div class="label">Číslo účtu (klikni pro kopírování):</div>
    <div class="account" id="accountNumber">103724597/0100</div>
    
    <div class="instruction">
      Do zprávy pro příjemce napište: <strong>Email a Herní jméno</strong>
    </div>

    <div class="prices">
      <div class="price-box">💰 50 Kč <span>/ měsíc</span></div>
      <div class="price-box">💰 150 Kč <span>/ rok</span></div>
    </div>

    <div class="buy-btn" onclick="copyAndNotify()">Potvrdit platbu</div>
  </div>
</div>

<script>
// Kopírování čísla účtu
const accountEl = document.getElementById('accountNumber');
accountEl.addEventListener('click', () => {
  navigator.clipboard.writeText(accountEl.textContent).then(() => {
    alert("Číslo účtu zkopírováno do schránky!");
  });
});

// Simulace BUY tlačítka
function copyAndNotify() {
  navigator.clipboard.writeText(accountEl.textContent).then(() => {
    alert("Číslo účtu zkopírováno.\nDo zprávy pro příjemce napište Email a Herní jméno.");
  });
}
</script>

</body>
</html>
