<!DOCTYPE html>
<html lang="cs">
<head>
  <link rel="stylesheet" href="cursor.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipeast SMP – Login</title>

<style>
* {
  box-sizing: border-box;
  font-family: Inter, system-ui, sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffd400;
  overflow: hidden;
}

/* ===== BACKGROUND ===== */
.motion-bg {
  position: fixed;
  inset: 0;
  background:
    linear-gradient(90deg, rgba(255,140,0,0.35) 1px, transparent 1px),
    linear-gradient(180deg, rgba(255,140,0,0.35) 1px, transparent 1px),
    radial-gradient(circle at 30% 30%, #ffe766, #ffc400);
  background-size: 80px 80px, 80px 80px, cover;
  animation: gridMove 25s linear infinite;
}

.motion-bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 70% 60%, rgba(255,120,0,0.35), transparent 60%);
  animation: pulse 6s ease-in-out infinite alternate;
}

@keyframes gridMove {
  0% { background-position: 0 0, 0 0, center; }
  50% { background-position: 200px 120px, 120px 200px, center; }
  100% { background-position: 400px 240px, 240px 400px, center; }
}

@keyframes pulse {
  from { opacity: 0.4; }
  to { opacity: 0.8; }
}

/* ===== WRAPPER ===== */
.wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 2;
  transform: translateY(-37.7px); /* posun nahoru */
}

/* ===== LOGO + TEXT FLOAT ===== */
.logo-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: logoFloat 4.5s ease-in-out infinite;
}

.logo-wrapper img {
  width: clamp(320px, 45vw, 450px); /* větší logo */
  height: auto;
  margin-bottom: 12px;
}

.logo-wrapper small {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 2px;
  color: rgba(0,0,0,0.65);
}

/* Float animace společně */
@keyframes logoFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* ===== LOGIN CARD ===== */
.login {
  width: 100%;
  max-width: 380px;
  padding: 42px;
  border-radius: 22px;

  font-family: system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.30),
    rgba(255,255,255,0.14)
  );
  backdrop-filter: blur(20px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.35),
    0 30px 80px rgba(0,0,0,0.35);
  margin-top: 24px;
}

/* ===== INPUTS ===== */
.field {
  position: relative;
  margin-bottom: 26px;
}

.field input {
  width: 100%;
  padding: 14px 42px 14px 0;
  background: transparent;
  border: none;
  border-bottom: 2px solid rgba(0,0,0,0.45);
  font-size: 16px;
  font-weight: 500;
  outline: none;
}

.field label {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  color: rgba(0,0,0,0.65);
  transition: 0.3s ease;
  font-weight: 500;
}

.field input:focus + label,
.field input:valid + label {
  top: -6px;
  font-size: 12px;
  color: #000;
}

/* ===== SHOW PASSWORD ICON (SVG) ===== */
.toggle-password {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 22px;
  height: 22px;
  cursor: pointer;
  opacity: 0.55;
  transition: opacity 0.2s ease;
}

.toggle-password:hover {
  opacity: 0.9;
}

.toggle-password.active {
  opacity: 1;
}

/* ===== BUTTON ===== */
button {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #ffb300, #ff6f00);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

button:active {
  transform: scale(0.96);
}

/* ===== MOBILE ===== */
@media (max-width: 480px) {
  .logo-wrapper img { width: 300px; }
  .logo-wrapper small { font-size: 14px; }
  .login { padding: 32px; }
}
</style>
</head>

<body>

<div class="motion-bg"></div>

<div class="wrapper">
  <div class="logo-wrapper">
    <img src="IMG_3811.png" alt="Shipeast SMP Logo">
    <small>SURVIVAL | ECONOMY</small>
  </div>

  <form class="login" autocomplete="on">
    <div class="field">
      <input type="email" name="email" autocomplete="email" inputmode="email" required>
      <label>Email</label>
    </div>

    <div class="field">
      <input id="password" type="password" name="password" autocomplete="current-password" required>
      <label>Password</label>
      <div class="toggle-password" id="toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
    </div>

    <button type="submit">Login</button>
   
    <!-- NOVÉ TLAČÍTKO -->
    <a href="signup.html" class="btn-link" style="display:block; text-align:center; margin-top:16px; color:#333; text-decoration:none; font-weight:500;">
    Don't have account? Create Account
    </a>
  </form>
</div>

<script>
const toggle = document.getElementById('toggle');
const password = document.getElementById('password');

toggle.addEventListener('click', () => {
  const visible = password.type === 'text';
  password.type = visible ? 'password' : 'text';
  toggle.classList.toggle('active', !visible);
});
</script>
  
<div class="cursor-dot"></div>
<div class="cursor-halo"></div>
<div class="cursor-outline"></div>

<script src="cursor.js"></script>

</body>
</html>
