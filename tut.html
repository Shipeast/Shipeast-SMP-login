<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How to Join – Shipeast SMP</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{height:100vh;background:#ffd400;overflow:hidden}

/* BACKGROUND – stejný jako ostatní stránky */
.bg{
  position:fixed;inset:0;
  background:
    linear-gradient(90deg,rgba(255,140,0,.35) 1px,transparent 1px),
    linear-gradient(180deg,rgba(255,140,0,.35) 1px,transparent 1px),
    radial-gradient(circle at 30% 30%,#ffe766,#ffc400);
  background-size:80px 80px,80px 80px,cover;
  animation:gridMove 25s linear infinite;
}
.bg::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 70% 60%,rgba(255,120,0,.35),transparent 60%);
  animation:pulse 6s ease-in-out infinite alternate;
}
@keyframes gridMove{0%{background-position:0 0,0 0,center}100%{background-position:400px 240px,240px 400px,center}}
@keyframes pulse{from{opacity:.4}to{opacity:.8}}

/* TOP BAR */
.topbar{
  position:absolute;top:32px;left:40px;
  z-index:3;
}
.topbar a{
  padding:10px 22px;
  border-radius:999px;
  background:rgba(255,255,255,.35);
  font-weight:700;
  text-decoration:none;
  color:#000;
}

/* CENTER */
.wrapper{
  position:relative;z-index:2;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:36px;
}

.logo{width:320px}

.card{
  width:100%;
  max-width:520px;
  padding:40px;
  border-radius:32px;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.16));
  backdrop-filter:blur(20px);
  box-shadow:0 40px 90px rgba(0,0,0,.35);
}

.card h1{
  font-size:28px;
  font-weight:900;
  margin-bottom:24px;
}

.step{
  display:flex;
  gap:16px;
  margin-bottom:18px;
}

.step-number{
  min-width:34px;height:34px;
  border-radius:50%;
  background:rgba(0,0,0,.1);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.step p{font-weight:600;line-height:1.5}

.ip{
  margin-top:20px;
  padding:14px 18px;
  border-radius:16px;
  background:rgba(255,255,255,.4);
  font-weight:800;
  cursor:pointer;
  display:inline-block;
}

.note{
  margin-top:18px;
  opacity:.7;
  font-size:14px;
}

@media(max-width:600px){
  .card{padding:28px}
  .logo{width:320px}
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="topbar">
  <a href="index.html">← Back</a>
</div>

<div class="wrapper">

  <img src="IMG_3811.png" class="logo" alt="Shipeast SMP">

  <div class="card">
    <h1>How to join</h1>

    <div class="step">
      <div class="step-number">1</div>
      <p>Spusť <strong>Minecraft Java Edition</strong></p>
    </div>

    <div class="step">
      <div class="step-number">2</div>
      <p>Zvol verzi <strong>1.21.8</strong></p>
    </div>

    <div class="step">
      <div class="step-number">3</div>
      <p>Multiplayer → Add Server</p>
    </div>

    <div class="step">
      <div class="step-number">4</div>
      <p>Vlož IP adresu serveru</p>
    </div>

    <div class="ip" onclick="copyIP()">shipeastsmp.net</div>

    <div class="note">Klikni na IP pro zkopírování</div>
  </div>

</div>

<script>
function copyIP(){
  const el=document.createElement('input');
  el.value='shipeastsmp.net';
  document.body.appendChild(el);
  el.select();
  document.execCommand('copy');
  document.body.removeChild(el);
}
</script>

</body>
</html>
