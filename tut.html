<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How to Join – Shipeast SMP</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{min-height:100vh;background:#1c1c1c;overflow:auto;color:#fff;}

/* ===== BACKGROUND ===== */
.bg{
  position:fixed;inset:0;
  background:
    linear-gradient(90deg,rgba(255,255,0,.35) 1px,transparent 1px),
    linear-gradient(180deg,rgba(255,255,0,.35) 1px,transparent 1px),
    radial-gradient(circle at 30% 30%,#333,#1c1c1c);
  background-size:80px 80px,80px 80px,cover;
  animation:gridMove 25s linear infinite;
}
.bg::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 70% 60%,rgba(255,215,0,.2),transparent 60%);
  animation:pulse 6s ease-in-out infinite alternate;
}
@keyframes gridMove{0%{background-position:0 0,0 0,center}100%{background-position:400px 240px,240px 400px,center}}
@keyframes pulse{from{opacity:.2}to{opacity:.5}}

/* ===== HOME BUTTON ===== */
.home{
  position:fixed;top:24px;left:24px;z-index:3;
  width:56px;height:56px;border-radius:18px;
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.3);
  transition:.3s ease;
}
.home:hover{transform:translateY(-4px)}
.home svg{width:26px;height:26px;stroke:#ffd400;stroke-width:2;fill:none}

/* ===== WRAPPER ===== */
.wrapper{
  position:relative;z-index:2;
  min-height:100%;
  display:flex;flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top: 40px;
  gap:36px;
}

/* ===== LOGO ===== */
.logo-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: logoFloat 4.5s ease-in-out infinite;
}
.logo-wrapper img {
  width: clamp(320px, 45vw, 450px);
  height: auto;
  margin-bottom: 12px;
}
.logo-wrapper small {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 2px;
  color: rgba(255,215,0,0.8);
}
@keyframes logoFloat {0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ===== CARD ===== */
.card{
  width:100%;
  max-width:380px;
  padding:40px;
  border-radius:32px;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  backdrop-filter:blur(20px);
  box-shadow:0 40px 90px rgba(0,0,0,.35);
  color:#fff;
}
.card h1{
  font-size:28px;
  font-weight:900;
  margin-bottom:24px;
  color:#ffd400;
}
.step{
  display:flex;
  gap:16px;
  margin-bottom:18px;
}
.step-number{
  min-width:34px;height:34px;
  border-radius:50%;
  background:rgba(255,255,0,.4);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  color:#1c1c1c;
}
.step p{font-weight:600;line-height:1.5}

.ip {
  background: rgba(255, 212, 0, 0.9); /* tmavší žlutá, viz hlavní grid */
  color: #1c1c1c; /* tmavě šedý text */
  font-weight: 800;
  padding: 14px 18px;
  border-radius: 16px;
  cursor: pointer;
  display: inline-block;
}

.note{
  margin-top:18px;
  opacity:.7;
  font-size:14px;
}

/* ===== MOBILE ===== */
@media (max-width: 480px) {
  .logo-wrapper img { width: 320px; }
  .logo-wrapper small { font-size: 14px; }
  .card { padding:32px; }
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="home" onclick="location.href='index.html'">
  <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
</div>

<div class="wrapper">
  <div class="logo-wrapper">
    <img src="tut.png" alt="Shipeast SMP Logo">
    <small>HOW TO JOIN MY SERVER?</small>
  </div>

  <div class="card">
    <h1>How to join</h1>

    <div class="step">
      <div class="step-number">1</div>
      <p>Spusť <strong>Minecraft Java Edition</strong></p>
    </div>

    <div class="step">
      <div class="step-number">2</div>
      <p>Zvol verzi <strong>1.21.8</strong></p>
    </div>

    <div class="step">
      <div class="step-number">3</div>
      <p>Multiplayer → Add Server</p>
    </div>

    <div class="step">
      <div class="step-number">4</div>
      <p>Vlož IP adresu serveru</p>
    </div>

    <div class="ip" onclick="copyIP()">shipeastsmp.net</div>
    <div class="note">Klikni na IP pro zkopírování</div>
  </div>
</div>

<script>
function copyIP(){
  const el=document.createElement('input');
  el.value='shipeastsmp.net';
  document.body.appendChild(el);
  el.select();
  document.execCommand('copy');
  document.body.removeChild(el);
}
</script>

</body>
</html>
