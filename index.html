<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipeast SMP</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{height:100vh;background:#ffd400;overflow:hidden}

/* ===== BACKGROUND ===== */
.bg{
  position:fixed;inset:0;
  background:
    linear-gradient(90deg,rgba(255,140,0,.35) 1px,transparent 1px),
    linear-gradient(180deg,rgba(255,140,0,.35) 1px,transparent 1px),
    radial-gradient(circle at 30% 30%,#ffe766,#ffc400);
  background-size:80px 80px,80px 80px,cover;
  animation:gridMove 25s linear infinite;
}
.bg::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 70% 60%,rgba(255,120,0,.35),transparent 60%);
  animation:pulse 6s ease-in-out infinite alternate;
}
@keyframes gridMove{0%{background-position:0 0,0 0,center}100%{background-position:400px 240px,240px 400px,center}}
@keyframes pulse{from{opacity:.4}to{opacity:.8}}

/* ===== TOP BAR ===== */
.topbar{
  position:absolute;top:32px;right:40px;
  display:flex;gap:16px;
  z-index:3;
}
.topbar a{
  padding:10px 22px;
  border-radius:999px;
  background:rgba(255,255,255,.35);
  font-weight:700;
  text-decoration:none;
  color:#000;
  transition:.25s ease;
}
.topbar a:hover{background:rgba(255,255,255,.55)}

/* ===== CENTER ===== */
.wrapper{
  position:relative;z-index:2;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:40px;
  transform:translateY(-10px);
}

.header{
  display:flex;
  align-items:center;
  gap:28px;
}

.logo{width:320px}

.server-box{
  display:flex;gap:14px;align-items:center;
  padding:14px 22px;
  background:rgba(255,255,255,.28);
  border-radius:20px;
  font-weight:800;
  cursor:pointer;
}
.server-box span{opacity:.7;font-weight:600}

/* ===== BUTTON GRID ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:28px;
  max-width:960px;
}

.card{
  height:180px;
  border-radius:32px;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.16));
  backdrop-filter:blur(20px);
  box-shadow:0 40px 90px rgba(0,0,0,.35);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  cursor:pointer;
  transition:.4s cubic-bezier(.2,.8,.2,1);
}
.card:hover{transform:translateY(-14px)}

.icon{
  width:56px;height:56px;
  stroke:#000;stroke-width:1.6;fill:none;
}
.card span{font-weight:900;letter-spacing:1.2px}

/* ===== MOBILE ===== */
@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .card{height:140px}
  .logo{width:230px}
  .header{flex-direction:column;gap:18px}
  .topbar{top:20px;right:20px}
}
</style>
</head>
<body>

<div class="bg"></div>

<!-- LOGIN / SIGNUP -->
<div class="topbar">
  <a href="login.html">Login</a>
  <a href="signup.html">Sign up</a>
</div>

<div class="wrapper">

  <div class="header">
    <img src="IMG_3811.png" class="logo" alt="Shipeast SMP">
    <div class="server-box" onclick="copyIP()">
      shipeastsmp.net <span>• 1.21.8</span>
    </div>
  </div>

  <div class="grid">

    <div class="card" onclick="location.href='vip.html'">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 7l4 10h10l4-10"/><path d="M7 7l5 6 5-6"/></svg>
      <span>VIP</span>
    </div>

    <div class="card" onclick="window.open('https://discord.gg/yourserver','_blank')">
      <svg class="icon" viewBox="0 0 24 24"><path d="M18 9a5 5 0 0 0-4-2"/><path d="M6 9a5 5 0 0 1 4-2"/><path d="M8 15h8"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/></svg>
      <span>DISCORD</span>
    </div>

    <div class="card" onclick="location.href='tut.html'">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M6 17V7l6-4 6 4v10"/></svg>
      <span>HOW TO JOIN</span>
    </div>

  </div>
</div>

<script>
function copyIP(){
  const el=document.createElement('input');
  el.value='shipeastsmp.net';
  document.body.appendChild(el);
  el.select();
  document.execCommand('copy');
  document.body.removeChild(el);
}
</script>

</body>
</html>
