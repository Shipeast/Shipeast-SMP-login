<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipeast SMP</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{height:100vh;background:#ffd400;overflow:hidden}

/* ===== BACKGROUND ===== */
.bg{
  position:fixed;inset:0;
  background:
    linear-gradient(90deg,rgba(255,140,0,.35) 1px,transparent 1px),
    linear-gradient(180deg,rgba(255,140,0,.35) 1px,transparent 1px),
    radial-gradient(circle at 30% 30%,#ffe766,#ffc400);
  background-size:80px 80px,80px 80px,cover;
  animation:gridMove 25s linear infinite;
}
.bg::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 70% 60%,rgba(255,120,0,.35),transparent 60%);
  animation:pulse 6s ease-in-out infinite alternate;
}
@keyframes gridMove{0%{background-position:0 0,0 0,center}100%{background-position:400px 240px,240px 400px,center}}
@keyframes pulse{from{opacity:.4}to{opacity:.8}}

/* ===== TOP BAR ===== */
.topbar{
  position:absolute;top:32px;right:40px;
  display:flex;gap:16px;
  z-index:3;
}
.topbar a{
  padding:10px 22px;
  border-radius:999px;
  background:rgba(255,255,255,.35);
  font-weight:700;
  text-decoration:none;
  color:#000;
  transition:.25s ease;
}
.topbar a:hover{background:rgba(255,255,255,.55)}

/* ===== CENTER ===== */
.wrapper{
  position:relative;z-index:2;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:40px;
  transform:translateY(-10px);
}

.header{
  display:flex;
  align-items:center;
  gap:28px;
}

/* ===== LOGO + TEXT FLOAT ===== */
.logo-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: logoFloat 4.5s ease-in-out infinite;
}

.logo-wrapper img {
  width: clamp(320px, 45vw, 450px);
  height: auto;
  margin-bottom: 12px;
}

.logo-wrapper small {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 2px;
  color: rgba(0,0,0,0.65);
}

@keyframes logoFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.server-box{
  display:flex;gap:14px;align-items:center;
  padding:14px 22px;
  background:rgba(255,255,255,.28);
  border-radius:20px;
  font-weight:800;
  cursor:pointer;
}
.server-box span{opacity:.7;font-weight:600}

/* ===== BUTTON GRID ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:28px;
  max-width:960px;
}

.card{
  height:180px;
  border-radius:32px;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.16));
  backdrop-filter:blur(20px);
  box-shadow:0 40px 90px rgba(0,0,0,.35);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  cursor:pointer;
  transition:.4s cubic-bezier(.2,.8,.2,1);
}
.card:hover{transform:translateY(-14px)}

.icon-img{
  width:56px;
  height:56px;
  object-fit:contain;
}
.card span{font-weight:900;letter-spacing:1.2px}

/* ===== MOBILE ===== */
@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .card{height:140px}
  .logo-wrapper img { width: 320px; }
  .logo-wrapper small { font-size: 14px; }
  .header{flex-direction:column;gap:18px}
  .topbar{top:20px;right:20px}
}
</style>
</head>
<body>

<div class="bg"></div>

<!-- LOGIN / SIGNUP -->
<div class="topbar">
  <a href="login.html">Login</a>
  <a href="signup.html">Sign up</a>
</div>

<div class="wrapper">
  <div class="logo-wrapper">
    <img src="IMG_3811.png" alt="Shipeast SMP Logo">
    <small>SURVIVAL | ECONOMY</small>
  </div>
  <div class="header">
    <div class="server-box" onclick="copyIP()">
      shipeastsmp.net <span>• 1.21.8</span>
    </div>
  </div>

  <div class="grid">

    <div class="card" onclick="location.href='vip.html'">
      <img src="vip.png" class="icon-img" alt="VIP">
      <span>VIP</span>
    </div>

    <div class="card" onclick="window.open('https://discord.gg/yourserver','_blank')">
      <img src="dis.png" class="icon-img" alt="Discord">
      <span>DISCORD</span>
    </div>

    <div class="card" onclick="location.href='tut.html'">
      <img src="tut.png" class="icon-img" alt="How to Join">
      <span>HOW TO JOIN</span>
    </div>

  </div>
</div>

<script>
function copyIP(){
  const el=document.createElement('input');
  el.value='shipeastsmp.net';
  document.body.appendChild(el);
  el.select();
  document.execCommand('copy');
  document.body.removeChild(el);
}
</script>

</body>
</html>
