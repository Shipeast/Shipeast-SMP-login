<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipeast SMP</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{min-height:100vh;background:#1c1c1c;overflow-y:auto}

/* ===== BACKGROUND ===== */
.bg{
  position:fixed;inset:0;
  background:
    linear-gradient(90deg,rgba(255,255,0,.35) 1px,transparent 1px),
    linear-gradient(180deg,rgba(255,255,0,.35) 1px,transparent 1px),
    radial-gradient(circle at 30% 30%,#333,#1c1c1c);
  background-size:80px 80px,80px 80px,cover;
  animation:gridMove 25s linear infinite;
}
.bg::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 70% 60%,rgba(255,215,0,.2),transparent 60%);
  animation:pulse 6s ease-in-out infinite alternate;
}
@keyframes gridMove{0%{background-position:0 0,0 0,center}100%{background-position:400px 240px,240px 400px,center}}
@keyframes pulse{from{opacity:.2}to{opacity:.5}}

/* ===== CONTENT ===== */
.wrapper{
  position:relative;z-index:2;
  display:flex;flex-direction:column;
  align-items:center;gap:40px;
  padding-top:120px;
}

.logo-wrapper{display:flex;flex-direction:column;align-items:center;animation:logoFloat 4.5s ease-in-out infinite}
.logo-wrapper img{width:clamp(320px,45vw,450px);margin-bottom:12px}
.logo-wrapper small{font-size:16px;font-weight:600;letter-spacing:2px;color:rgba(255,215,0,.8)}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.server-box{
  padding:14px 22px;
  background:rgba(255,215,0,.2);
  border-radius:20px;
  font-weight:800;color:#fff;cursor:pointer;
}

/* BIG BUTTONS */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:40px;
  max-width:1100px;
  margin-top:40px;
}
.card{height:480px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.35s}
.card:hover{transform:translateY(-12px) scale(1.05)}
.card img{width:100%;height:100%;object-fit:contain}

@media(max-width:900px){.grid{grid-template-columns:1fr}.card{height:320px}}

/* OVERLAY */
#lightOverlay{
  position:fixed;inset:0;
  pointer-events:none;
  z-index:5;
  opacity:0;
  transition:opacity .4s ease;
}
</style>
</head>
<body>

<div class="bg"></div>
<canvas id="lightOverlay"></canvas>

<div class="wrapper">
  <div class="logo-wrapper">
    <img src="logo.png">
    <small>SURVIVAL | ECONOMY</small>
  </div>

  <div class="server-box" onclick="navigator.clipboard.writeText('shipeastsmp.net')">
    shipeastsmp.net • 1.21.8
  </div>

  <div class="grid">
    <div class="card" onclick="location.href='vip.html'"><img src="vip.png"></div>
    <div class="card" onclick="window.open('https://discord.gg/67RBYPmby','_blank')"><img src="dis.png"></div>
    <div class="card" onclick="location.href='tut.html'"><img src="tut.png"></div>
  </div>
</div>

<script>
const canvas=document.getElementById("lightOverlay");
const ctx=canvas.getContext("2d");
let w,h;function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}resize();addEventListener("resize",resize);

const lanternImg=new Image();
lanternImg.src="lantern.png";

let active=false;
let mouse={x:0,y:0};

document.addEventListener("mouseenter",()=>{active=true;canvas.style.opacity=1});
document.addEventListener("mouseleave",()=>{active=false;canvas.style.opacity=0});
document.addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});

/* physics */
let ly=0,swing=0,vel=0;

function update(){
  const targetY=mouse.y+110;
  ly+=(targetY-ly)*0.07;

  const targetSwing=(mouse.x-w/2)/w;
  vel+=(targetSwing-swing)*0.035;
  vel*=0.9;
  swing+=vel;
}

function drawChain(x1,y1,x2,y2){
  const segments=8;
  for(let i=0;i<segments;i++){
    const t=i/segments;
    const nx=x1+(x2-x1)*t + Math.sin(t*Math.PI)*swing*20;
    const ny=y1+(y2-y1)*t;
    ctx.beginPath();
    ctx.arc(nx,ny,2.2,0,Math.PI*2);
    ctx.fillStyle="#ffd400";
    ctx.fill();
  }
}

function draw(){
  ctx.clearRect(0,0,w,h);

  // permanent darkness
  ctx.fillStyle="rgba(0,0,0,.65)";
  ctx.fillRect(0,0,w,h);

  if(!active) return;

  let lx=mouse.x + swing*70;
  let ly2=ly;

  // light
  let g=ctx.createRadialGradient(lx,ly2,80,lx,ly2,380);
  g.addColorStop(0,"rgba(255,230,150,1)");
  g.addColorStop(.5,"rgba(255,210,120,.55)");
  g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.globalCompositeOperation="destination-out";
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(lx,ly2,380,0,Math.PI*2);ctx.fill();
  ctx.globalCompositeOperation="source-over";

  // chain start BELOW cursor
  const startX=mouse.x;
  const startY=mouse.y+18;

  drawChain(startX,startY,lx,ly2-25);

  ctx.drawImage(lanternImg,lx-30,ly2-30,60,60);
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>

</body>
</html>
