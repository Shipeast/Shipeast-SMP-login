<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipeast SMP</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{min-height:100vh;background:#1c1c1c;overflow-y:auto}

/* ===== BACKGROUND ===== */
.bg{
  position:fixed;inset:0;
  background:
    linear-gradient(90deg,rgba(255,255,0,.35) 1px,transparent 1px),
    linear-gradient(180deg,rgba(255,255,0,.35) 1px,transparent 1px),
    radial-gradient(circle at 30% 30%,#333,#1c1c1c);
  background-size:80px 80px,80px 80px,cover;
  animation:gridMove 25s linear infinite;
}
.bg::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 70% 60%,rgba(255,215,0,.2),transparent 60%);
  animation:pulse 6s ease-in-out infinite alternate;
}
@keyframes gridMove{0%{background-position:0 0,0 0,center}100%{background-position:400px 240px,240px 400px,center}}
@keyframes pulse{from{opacity:.2}to{opacity:.5}}

/* ===== CENTER ===== */
.wrapper{
  position:relative;z-index:2;
  display:flex;flex-direction:column;
  align-items:center;gap:40px;
  padding-top:120px;
}

.logo-wrapper{display:flex;flex-direction:column;align-items:center;animation:logoFloat 4.5s ease-in-out infinite}
.logo-wrapper img{width:clamp(320px,45vw,450px);margin-bottom:12px}
.logo-wrapper small{font-size:16px;font-weight:600;letter-spacing:2px;color:rgba(255,215,0,.8)}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.server-box{
  display:flex;gap:14px;align-items:center;
  padding:14px 22px;
  background:rgba(255,215,0,.2);
  border-radius:20px;
  font-weight:800;color:#fff;cursor:pointer;
}

/* ===== BIG BUTTONS ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:40px;
  max-width:1100px;
  margin-top:40px;
}
.card{
  height:480px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:.35s ease;
}
.card:hover{transform:translateY(-12px) scale(1.04)}
.card img{width:100%;height:100%;object-fit:contain}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .card{height:320px}
}

/* ===== LANTERN CANVAS ===== */
#lightOverlay{
  position:fixed;inset:0;
  pointer-events:none;
  z-index:5;
  opacity:0;
  transition:opacity .4s ease;
}
</style>
</head>
<body>

<div class="bg"></div>
<canvas id="lightOverlay"></canvas>

<div class="wrapper">
  <div class="logo-wrapper">
    <img src="logo.png">
    <small>SURVIVAL | ECONOMY</small>
  </div>

  <div class="server-box" onclick="navigator.clipboard.writeText('shipeastsmp.net')">
    shipeastsmp.net • 1.21.8
  </div>

  <div class="grid">
    <div class="card" onclick="location.href='vip.html'"><img src="vip.png"></div>
    <div class="card" onclick="window.open('https://discord.gg/67RBYPmby','_blank')"><img src="dis.png"></div>
    <div class="card" onclick="location.href='tut.html'"><img src="tut.png"></div>
  </div>
</div>

<script>
const canvas=document.getElementById("lightOverlay");
const ctx=canvas.getContext("2d");
let w,h;function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}resize();addEventListener("resize",resize);

const lanternImg=new Image();
lanternImg.src="lantern.png";

let mouseActive=false;
let mouse={x:0,y:0};

document.addEventListener("mouseenter",()=>{mouseActive=true;canvas.style.opacity=1});
document.addEventListener("mouseleave",()=>{mouseActive=false;canvas.style.opacity=0});

document.addEventListener("mousemove",e=>{
  mouse.x=e.clientX;
  mouse.y=e.clientY;
});

/* ===== SOFT ROPE ===== */
let ropeY=0, swing=0, vel=0;

function update(){
  if(!mouseActive) return;

  const targetY=mouse.y+90; // lantern hangs lower
  ropeY += (targetY-ropeY)*0.08;

  const targetSwing=(mouse.x-w/2)/w;
  vel+=(targetSwing-swing)*0.02;
  vel*=0.92;
  swing+=vel;
}

function draw(){
  ctx.clearRect(0,0,w,h);
  if(!mouseActive) return;

  ctx.fillStyle="rgba(0,0,0,.6)";
  ctx.fillRect(0,0,w,h);

  let lx=mouse.x + swing*60;
  let ly=ropeY;

  let g=ctx.createRadialGradient(lx,ly,80,lx,ly,360);
  g.addColorStop(0,"rgba(255,230,150,1)");
  g.addColorStop(.5,"rgba(255,210,120,.6)");
  g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.globalCompositeOperation="destination-out";
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(lx,ly,360,0,Math.PI*2);ctx.fill();
  ctx.globalCompositeOperation="source-over";

  ctx.strokeStyle="#ffd400";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(mouse.x,mouse.y);
  ctx.lineTo(lx,ly-20);
  ctx.stroke();

  ctx.drawImage(lanternImg,lx-30,ly-30,60,60);
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>

</body>
</html>
