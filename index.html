<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipeast SMP</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{min-height:100vh;background:#1c1c1c;overflow-y:auto}

/* ===== BACKGROUND ===== */
.bg{
  position:fixed;inset:0;
  background:
    linear-gradient(90deg,rgba(255,255,0,.35) 1px,transparent 1px),
    linear-gradient(180deg,rgba(255,255,0,.35) 1px,transparent 1px),
    radial-gradient(circle at 30% 30%,#333,#1c1c1c);
  background-size:80px 80px,80px 80px,cover;
  animation:gridMove 25s linear infinite;
}
.bg::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 70% 60%,rgba(255,215,0,.2),transparent 60%);
  animation:pulse 6s ease-in-out infinite alternate;
}
@keyframes gridMove{0%{background-position:0 0,0 0,center}100%{background-position:400px 240px,240px 400px,center}}
@keyframes pulse{from{opacity:.2}to{opacity:.5}}

.wrapper{
  position:relative;z-index:2;
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:40px;
  padding-top:120px;
}

.logo-wrapper {display:flex;flex-direction:column;align-items:center;animation:logoFloat 4.5s ease-in-out infinite;}
.logo-wrapper img {width: clamp(320px, 45vw, 450px);}
.logo-wrapper small {font-size:16px;font-weight:600;letter-spacing:2px;color:rgba(255,215,0,0.8);}
@keyframes logoFloat {0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.server-box{
  display:flex;gap:14px;align-items:center;
  padding:14px 22px;background:rgba(255,215,0,.2);
  border-radius:20px;font-weight:800;color:#fff;cursor:pointer;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:28px;
  max-width:960px;
  margin-top:40px;
}
.card{height:400px;border-radius:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.4s}
.card:hover{transform:translateY(-14px)}
.card img{width:100%;height:100%;object-fit:contain}

canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:5;
}
</style>
</head>
<body>

<div class="bg"></div>
<canvas id="lightOverlay"></canvas>

<div class="wrapper">
  <div class="logo-wrapper">
    <img src="logo.png" alt="Logo">
    <small>SURVIVAL | ECONOMY</small>
  </div>

  <div class="server-box" onclick="copyIP()">shipeastsmp.net</div>

  <div class="grid">
    <div class="card" onclick="location.href='vip.html'"><img src="vip.png"></div>
    <div class="card" onclick="window.open('https://discord.gg/67RBYPmby')"><img src="dis.png"></div>
    <div class="card" onclick="location.href='tut.html'"><img src="tut.png"></div>
  </div>
</div>

<script>
function copyIP(){
  navigator.clipboard.writeText("shipeastsmp.net");
}

/* ===== LANTERN PHYSICS ===== */
const canvas=document.getElementById("lightOverlay");
const ctx=canvas.getContext("2d");
let w,h;
function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
resize();addEventListener("resize",resize);

const lanternImg=new Image();
lanternImg.src="lantern.png";

let mouse={x:w/2,y:h/2,vx:0,vy:0};
addEventListener("mousemove",e=>{
  mouse.vx=e.movementX;
  mouse.vy=e.movementY;
  mouse.x=e.clientX;
  mouse.y=e.clientY;
});

let segments=20;
let length=11;
let rope=[];
for(let i=0;i<segments;i++){
  rope.push({x:mouse.x,y:mouse.y+i*length,oldx:mouse.x,oldy:mouse.y+i*length});
}

function update(){
  rope[0].x=mouse.x;
  rope[0].y=mouse.y-10;

  for(let i=1;i<segments;i++){
    let p=rope[i];
    let vx=(p.x-p.oldx)*0.995; // větší tlumení = pomalejší kývání
    let vy=(p.y-p.oldy)*0.995 + 0.35; // gravitace
    p.oldx=p.x;
    p.oldy=p.y;
    p.x+=vx;
    p.y+=vy;
  }

  // síla rozhoupání podle rychlosti myši
  let swing=Math.min(Math.hypot(mouse.vx,mouse.vy)*0.15,6);
  rope[segments-1].x+=mouse.vx*0.05;
  rope[segments-1].y+=swing;

  for(let k=0;k<5;k++){
    for(let i=1;i<segments;i++){
      let p=rope[i], prev=rope[i-1];
      let dx=prev.x-p.x, dy=prev.y-p.y;
      let dist=Math.sqrt(dx*dx+dy*dy);
      let diff=(dist-length)/dist;
      p.x+=dx*diff*0.5;
      p.y+=dy*diff*0.5;
    }
  }
}

function draw(){
  ctx.clearRect(0,0,w,h);

  ctx.fillStyle="rgba(0,0,0,.65)";
  ctx.fillRect(0,0,w,h);

  let lx=rope[segments-1].x;
  let ly=rope[segments-1].y;

  let g=ctx.createRadialGradient(lx,ly,60,lx,ly,260);
  g.addColorStop(0,"rgba(255,215,120,.9)");
  g.addColorStop(.5,"rgba(255,200,80,.4)");
  g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.globalCompositeOperation="destination-out";
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(lx,ly,260,0,Math.PI*2);
  ctx.fill();
  ctx.globalCompositeOperation="source-over";

  ctx.strokeStyle="rgba(255,215,0,.7)";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(rope[0].x,rope[0].y);
  for(let i=1;i<segments;i++) ctx.lineTo(rope[i].x,rope[i].y);
  ctx.stroke();

  ctx.drawImage(lanternImg,lx-32,ly-32,64,64);
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
