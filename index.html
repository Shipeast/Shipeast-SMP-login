<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipeast SMP – Welcome</title>

<style>
* {
  box-sizing: border-box;
  font-family: Inter, system-ui, sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffd400;
  overflow: hidden;
}

/* ===== BACKGROUND ===== */
.motion-bg {
  position: fixed;
  inset: 0;
  background:
    linear-gradient(90deg, rgba(255,140,0,0.35) 1px, transparent 1px),
    linear-gradient(180deg, rgba(255,140,0,0.35) 1px, transparent 1px),
    radial-gradient(circle at 30% 30%, #ffe766, #ffc400);
  background-size: 80px 80px, 80px 80px, cover;
  animation: gridMove 25s linear infinite;
}

.motion-bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 70% 60%, rgba(255,120,0,0.35), transparent 60%);
  animation: pulse 6s ease-in-out infinite alternate;
}

@keyframes gridMove {
  0% { background-position: 0 0, 0 0, center; }
  50% { background-position: 200px 120px, 120px 200px, center; }
  100% { background-position: 400px 240px, 240px 400px, center; }
}

@keyframes pulse {
  from { opacity: 0.4; }
  to { opacity: 0.8; }
}

/* ===== WRAPPER ===== */
.wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 2;
  transform: translateY(-37.7px);
}

/* ===== LOGO ===== */
.logo-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: logoFloat 4.5s ease-in-out infinite;
  margin-bottom: 32px;
}

.logo-wrapper img {
  width: 300px;
  height: auto;
  margin-bottom: 12px;
}

.logo-wrapper small {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 2px;
  color: rgba(0,0,0,0.65);
}

@keyframes logoFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* ===== BUTTONS ===== */
.btn {
  width: 220px;
  padding: 16px;
  margin: 12px 0;
  border: none;
  border-radius: 50px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  color: white;
  background: linear-gradient(135deg, #ffb300, #ff6f00);
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  transition: transform 0.2s ease, opacity 0.2s ease;
  text-decoration: none;
  text-align: center;
  display: inline-block;
}

.btn:hover {
  transform: scale(1.03);
  opacity: 0.95;
}

.btn:active {
  transform: scale(0.96);
}

/* ===== MOBILE ===== */
@media (max-width: 480px) {
  .logo-wrapper img { width: 260px; }
  .btn { width: 180px; padding: 14px; font-size: 14px; }
}
</style>
</head>

<body>

<div class="motion-bg"></div>

<div class="wrapper">
  <div class="logo-wrapper">
    <img src="IMG_3810.png" alt="Shipeast SMP Logo">
    <small>SURVIVAL | ECONOMY</small>
  </div>

  <a href="login.html" class="btn">Login</a>
  <a href="signup.html" class="btn">Sign Up</a>
</div>

</body>
</html>
